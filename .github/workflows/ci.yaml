name: CI Pipeline

on: [push]

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: |
                      10603/nestjs-blog-api:latest
                      10603/nestjs-blog-api:${{ github.sha }}
            - name: Download current task definition
              run: |
                  aws ecs describe-task-definition \
                    --task-definition blog-api-service \
                    --query taskDefinition > task-def.json

            - name: Render new image into task definition
              id: task-def
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with:
                  task-definition: task-def.json
                  container-name: blog-api
                  image: 10603/nestjs-blog-api:${{ github.sha }}

            - name: Deploy to ECS
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                  task-definition: ${{ steps.task-def.outputs.task-definition }}
                  service: nestjs-blog-api
                  cluster: blog-api-cluster
                  wait-for-service-stability: true
